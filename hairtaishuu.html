<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чи надад хайртай юу? ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #2d142c, #1a0b1c, #0b0710);
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* Арын хөвөгч зүрхнүүд */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 105, 180, 0.25);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* Голын карт */
        .card {
            background: rgba(30, 18, 36, 0.92);
            border: 1.5px solid rgba(255, 182, 193, 0.25);
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 77, 109, 0.15);
            width: 370px;
            max-width: 90vw;
            position: relative;
            z-index: 10;
        }

        /* Хөөрхөн баавгайнууд */
        .bears-container {
            width: 150px;
            height: 130px;
            margin: 0 auto 10px;
            animation: gentleBounce 2.2s infinite ease-in-out;
        }
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }

        h2 {
            color: #ffccd5;
            font-size: 30px;
            font-weight: 800;
            margin: 10px 0 8px;
            text-shadow: 0 2px 10px rgba(255, 77, 109, 0.4);
        }

        p {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 35px;
            opacity: 0.85;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 60px;
        }

        button {
            padding: 13px 30px;
            font-size: 17px;
            font-weight: 800;
            font-family: inherit;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), left 0.2s ease-out, top 0.2s ease-out;
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff4d6d, #ff758f);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.5);
            z-index: 20;
        }
        #yesBtn:hover {
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.75);
        }

        #noBtn {
            background: #2b2135;
            border: 1.5px solid rgba(255, 182, 193, 0.3);
            color: #f8fafc;
            z-index: 999;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* Зүрхэн бороо */
        .celebrate-heart {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 1000;
            animation: burst 1.5s ease-out forwards;
        }
        @keyframes burst {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-hearts" id="bgHearts"></div>

    <div class="card" id="card">
        <div class="bears-container">
            <svg viewBox="0 0 200 170" width="100%" height="100%">
                <path d="M95 35 C95 25, 80 25, 80 35 C80 45, 95 53, 95 53 C95 53, 110 45, 110 35 C110 25, 95 25, 95 35 Z" fill="#ff4d6d"/>
                <path d="M122 22 C122 15, 112 15, 112 22 C112 29, 122 35, 122 35 C122 35, 132 29, 132 22 C132 15, 122 15, 122 22 Z" fill="#ff8fa3"/>
                
                <!-- Бор баавгай -->
                <circle cx="145" cy="72" r="14" fill="#a47148"/>
                <circle cx="145" cy="72" r="7" fill="#d4a373"/>
                <circle cx="105" cy="72" r="14" fill="#a47148"/>
                <circle cx="125" cy="95" r="34" fill="#a47148"/>
                <ellipse cx="125" cy="103" rx="14" ry="11" fill="#faedcd"/>
                <circle cx="125" cy="99" r="3.5" fill="#432818"/>
                <path d="M121 105 Q125 109 129 105" stroke="#432818" stroke-width="2" fill="none" stroke-linecap="round"/>
                <circle cx="114" cy="91" r="3" fill="#2b190e"/>
                <circle cx="136" cy="91" r="3" fill="#2b190e"/>
                <ellipse cx="108" cy="100" rx="5" ry="3" fill="#ff8fa3" opacity="0.7"/>
                <ellipse cx="142" cy="100" rx="5" ry="3" fill="#ff8fa3" opacity="0.7"/>
                <path d="M98 122 Q125 165 152 122 Z" fill="#a47148"/>

                <!-- Цагаан баавгай -->
                <circle cx="52" cy="76" r="13" fill="#ffffff"/>
                <circle cx="52" cy="76" r="6" fill="#ffc2d1"/>
                <circle cx="92" cy="76" r="13" fill="#ffffff"/>
                <circle cx="72" cy="98" r="33" fill="#ffffff"/>
                <path d="M58 93 Q63 88 68 93" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <path d="M78 93 Q83 88 88 93" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <circle cx="73" cy="100" r="3" fill="#333"/>
                <path d="M68 106 Q73 113 78 106 Z" fill="#ff4d6d"/>
                <ellipse cx="56" cy="102" rx="5" ry="3" fill="#ff8fa3" opacity="0.8"/>
                <ellipse cx="89" cy="102" rx="5" ry="3" fill="#ff8fa3" opacity="0.8"/>
                <path d="M48 124 Q72 165 98 124 Z" fill="#ffffff"/>
                <path d="M85 118 Q115 112 122 122 Q115 130 85 128 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
            </svg>
        </div>

        <h2>Чи надад хайртай юу?</h2>
        <p>Зөвхөн ганцхан зөв хариулт байгаа шүү 😉</p>

        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">Тийм ❤️</button>
            <button id="noBtn" onmouseover="dodgeNo()" ontouchstart="dodgeNo()" onclick="dodgeNo()">Үгүй</button>
        </div>
    </div>

    <script>
        // Арын зүрхнүүд
        const bgHearts = document.getElementById('bgHearts');
        const heartIcons = ['❤️', '💖', '💕', '💗', '💓'];
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 18 + 12) + 'px';
            heart.style.animationDuration = (Math.random() * 6 + 6) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            bgHearts.appendChild(heart);
        }

        let yesScale = 1;
        let dodgeCount = 0;

        const noTexts = [
            "Бодож үзье...",
            "Мэдэхгүй ээ...",
            "Итгэлтэй байна уу?",
            "Дахиад сайн бод доо!",
            "Тэгж болохгүй шүү!",
            "Буруу товч байна 👀",
            "Намайг гомдоох нь уу 😢",
            "Сүүлчийн боломж шүү!",
            "Зүгээр л Тийм дарчих ❤️"
        ];

        function dodgeNo() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');

            // Товчийг card-аас гаргаж body руу шууд шилжүүлснээр дэлгэц даяар чөлөөтэй зугтана
            if (noBtn.parentElement !== document.body) {
                const rect = noBtn.getBoundingClientRect();
                document.body.appendChild(noBtn);
                noBtn.style.position = 'fixed';
                noBtn.style.left = rect.left + 'px';
                noBtn.style.top = rect.top + 'px';
            }

            // Эхлээд бичгийг нь солиод дараа нь хэмжээг нь тооцно
            noBtn.innerText = noTexts[dodgeCount % noTexts.length];
            dodgeCount++;

            const padding = 30;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // "Тийм" товчийг томруулах
            yesScale += 0.22;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function sayYes() {
            // Зугтаж байгаа "Үгүй" товчийг алга болгох
            const noBtn = document.getElementById('noBtn');
            if (noBtn) noBtn.remove();

            for (let i = 0; i < 40; i++) {
                const burst = document.createElement('div');
                burst.className = 'celebrate-heart';
                burst.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                burst.style.left = '50vw';
                burst.style.top = '50vh';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 250 + 80;
                burst.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                burst.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                document.body.appendChild(burst);
                setTimeout(() => burst.remove(), 1500);
            }

            document.getElementById('card').innerHTML = `
                <div style="font-size: 75px; animation: gentleBounce 1.2s infinite;">🥰💖🧸</div>
                <h2 style="color: #ff4d6d; font-size: 32px; margin-top: 15px;">Би ч бас чамд хайртай! ❤️</h2>
                <p style="color: #f8fafc; font-size: 16px; margin-top: 12px; line-height: 1.5;">
                    Хамгийн зөв сонголт байлаа! ✨<br>Чамтай хамт байх үргэлж гоё шүү 💕
                </p>
            `;
        }
    </script>
</body>
</html>
